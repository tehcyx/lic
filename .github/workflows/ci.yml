name: CI

# Run tools/verify-local.sh before pushing; dispatch only for a hosted fallback.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: go test ./...
    - run: go vet ./...
